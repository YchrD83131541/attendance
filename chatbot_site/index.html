<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>アクロポートガイド</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="header-logo">
        <img src="/images/acrologo.png" alt="アクロポートロゴ" class="header-logo-img" />
      </div>
      <h1>アクロポートガイド</h1>
      <p>よくある質問にお答えします！見学・入会もお気軽にどうぞ 😊</p>
    </header>

    <section class="faq-box">
      <h2>📋 サービスを選んでね</h2>
      <div class="service-selector">
        <label><input type="radio" name="service" value="adult" checked /> 💪 大人のフィットネス</label>
        <label><input type="radio" name="service" value="kids" /> 🏊 子供のスイミング</label>
      </div>
      <div class="faq-buttons"></div>
    </section>

    <section class="chat-box" aria-label="チャットボット">
      <div id="chat-log" class="chat-log"></div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="💬 質問を入力してください" autocomplete="off" required />
        <button type="submit">送信 🚀</button>
      </form>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
